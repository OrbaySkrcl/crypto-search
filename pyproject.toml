[project]
name = "alpha-hunter"
version = "0.1.0"
description = "Twitter memecoin cagrilarindan gercek alfa hesaplarini ayiklayan otonom bot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP017", "UP042"]
